name: Engineering Metrics

"on":
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Engineering Metrics
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const username = "sridharsiva3896-spec";

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }

                    totalPullRequestContributions
                    totalIssueContributions
                    totalPullRequestReviewContributions
                    totalRepositoriesWithContributedCommits
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              login: username
            });

            const user = result.user;
            const calendar = user.contributionsCollection.contributionCalendar;

            const days = calendar.weeks
              .flatMap(week => week.contributionDays)
              .sort((a, b) => a.date.localeCompare(b.date));

            function calculateStreaks(days) {
              let longest = 0;
              let current = 0;
              let running = 0;

              for (const day of days) {
                if (day.contributionCount > 0) {
                  running++;
                  longest = Math.max(longest, running);
                } else {
                  running = 0;
                }
              }

              for (let i = days.length - 1; i >= 0; i--) {
                if (days[i].contributionCount > 0) {
                  current++;
                } else {
                  break;
                }
              }

              return { current, longest };
            }

            const streaks = calculateStreaks(days);

            const metrics = {
              contributions: calendar.totalContributions,
              currentStreak: streaks.current,
              longestStreak: streaks.longest,
              pullRequests:
                user.contributionsCollection.totalPullRequestContributions,
              issues:
                user.contributionsCollection.totalIssueContributions,
              reviews:
                user.contributionsCollection.totalPullRequestReviewContributions,
              repositories:
                user.contributionsCollection.totalRepositoriesWithContributedCommits
            };

            fs.mkdirSync("assets", { recursive: true });

            const svg = `
            <svg width="900" height="230" viewBox="0 0 900 230"
                 xmlns="http://www.w3.org/2000/svg">

              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#111827"/>
                  <stop offset="100%" stop-color="#0b1220"/>
                </linearGradient>

                <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#60a5fa"/>
                  <stop offset="100%" stop-color="#a78bfa"/>
                </linearGradient>
              </defs>

              <rect x="0" y="0" width="900" height="230"
                    rx="18" fill="url(#bg)"
                    stroke="#263247"/>

              <text x="38" y="42"
                    fill="#ffffff"
                    font-size="22"
                    font-family="Arial, sans-serif"
                    font-weight="700">
                Engineering Metrics
              </text>

              <text x="38" y="67"
                    fill="#8fa3bf"
                    font-size="12"
                    font-family="Arial, sans-serif">
                GitHub activity • automatically updated
              </text>

              <rect x="38" y="82" width="824" height="2"
                    fill="url(#accent)"/>

              <g font-family="Arial, sans-serif">

                <text x="72" y="125"
                      fill="#ffffff"
                      font-size="30"
                      font-weight="700">
                  ${metrics.contributions}
                </text>

                <text x="72" y="150"
                      fill="#8fa3bf"
                      font-size="12">
                  TOTAL CONTRIBUTIONS
                </text>

                <text x="72" y="177"
                      fill="#60a5fa"
                      font-size="12">
                  GitHub activity
                </text>

                <line x1="270" y1="105" x2="270" y2="190"
                      stroke="#334155"/>

                <text x="325" y="125"
                      fill="#ffffff"
                      font-size="30"
                      font-weight="700">
                  ${metrics.currentStreak}
                </text>

                <text x="325" y="150"
                      fill="#8fa3bf"
                      font-size="12">
                  CURRENT STREAK
                </text>

                <text x="325" y="177"
                      fill="#a78bfa"
                      font-size="12">
                  Consecutive days
                </text>

                <line x1="520" y1="105" x2="520" y2="190"
                      stroke="#334155"/>

                <text x="575" y="125"
                      fill="#ffffff"
                      font-size="30"
                      font-weight="700">
                  ${metrics.longestStreak}
                </text>

                <text x="575" y="150"
                      fill="#8fa3bf"
                      font-size="12">
                  LONGEST STREAK
                </text>

                <text x="575" y="177"
                      fill="#34d399"
                      font-size="12">
                  Personal best
                </text>

                <line x1="760" y1="105" x2="760" y2="190"
                      stroke="#334155"/>

                <text x="790" y="125"
                      fill="#ffffff"
                      font-size="24"
                      font-weight="700">
                  ${metrics.pullRequests}
                </text>

                <text x="790" y="150"
                      fill="#8fa3bf"
                      font-size="11">
                  PRs
                </text>

                <text x="790" y="177"
                      fill="#fbbf24"
                      font-size="11">
                  ${metrics.reviews} reviews
                </text>

              </g>

              <text x="38" y="215"
                    fill="#64748b"
                    font-size="10"
                    font-family="Arial, sans-serif">
                Source: GitHub Contributions API • ${new Date().toISOString().slice(0,10)}
              </text>

            </svg>
            `;

            fs.writeFileSync(
              "assets/engineering-metrics.svg",
              svg.trim()
            );

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/engineering-metrics.svg

          if git diff --cached --quiet; then
            echo "No metrics changes."
          else
            git commit -m "chore: update engineering metrics"
            git push
          fi
